name: Release

# 手動実行 (workflow_dispatch) のみ。push では自動ビルドしない。
# ローカルからは `pnpm release` で起動する。
on:
  workflow_dispatch:

# GitHub Release の作成とアセットアップロードに contents: write が必要。
permissions:
  contents: write

# 連続実行時は走行中の古いビルドをキャンセルし、CI 分数を節約する。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel / Apple Silicon 両対応の universal バイナリを dmg で配布する。
          # 署名は tauri.conf.json の signingIdentity "-" による ad-hoc 署名 (公証なし)。
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          # Windows は署名なしの NSIS インストーラー (.exe) のみ。MSI は作らない。
          - platform: windows-latest
            rust-targets: ''
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust (cargo + target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri.conf.json の version から v<version> タグの Release を作成し、
      # ビルド成果物をアップロードする。並列 matrix の片方だけで公開状態に
      # ならないよう draft で作成し、全プラットフォーム成功後に publish ジョブで公開する。
      # 注意: 公開済みバージョンと同じ version で再実行すると、tauri-action が
      # draft 状態の不一致でエラーになる。必ず version を上げてから実行すること。
      - name: Build and upload to GitHub Release (draft)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: ArcVault v__VERSION__
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # 全プラットフォームのビルド・アップロードが成功した時のみ draft を公開する。
  # どれかが失敗した場合は draft のまま残る (不完全な Release は公開されない)。
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release edit "v${VERSION}" --draft=false --latest
