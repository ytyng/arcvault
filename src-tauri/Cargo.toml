[package]
name = "arcvault"
version = "0.1.0"
description = "ArcVault - Windows-compatible ZIP archiver for macOS"
authors = ["ytyng"]
license = "MIT"
# crates.io には出さない。cargo-about が自分自身を一覧に載せないための印でもある (about.toml の private)
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "arcvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
walkdir = "2"
tauri-plugin-dialog = "2.5.0"
encoding_rs = "0.8"

